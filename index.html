<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinyTerm</title>
    <script>window.__BOOT_AT__ = performance.now()</script>
    <style>
      :root {
        color-scheme: dark;
      }

      html, body, #root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07162d;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', 'Segoe UI', sans-serif;
        color: #e7eff9;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 30%, rgba(53, 110, 213, 0.18), transparent 28%),
          linear-gradient(180deg, #07111f 0%, #07162d 54%, #091b31 100%);
      }

      .boot-shell {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(10, 25, 46, 0.74);
        border: 1px solid rgba(119, 181, 255, 0.14);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.05),
          0 12px 32px rgba(0, 0, 0, 0.24);
      }

      .boot-blocks {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }

      .boot-row {
        display: flex;
        justify-content: center;
        gap: 2px;
      }

      .boot-block {
        width: 3px;
        height: 3px;
        border-radius: 1px;
        background: rgba(58, 132, 255, 0.12);
        animation: boot-block-wave 1s ease-in-out infinite;
      }

      @keyframes boot-block-wave {
        0%, 100% {
          background: rgba(58, 132, 255, 0.12);
          transform: scale(1);
          box-shadow: none;
        }
        50% {
          background: rgba(58, 132, 255, 0.9);
          transform: scale(1.4);
          box-shadow: 0 0 5px rgba(58, 132, 255, 0.4);
        }
      }

      @media (max-width: 640px) {
        .boot-shell {
          width: 58px;
          height: 58px;
        }

        .boot-spinner {
          width: 24px;
          height: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-shell">
        <div class="boot-blocks">
          <div class="boot-row">
            <div class="boot-block" style="animation-delay: 0.18s"></div>
            <div class="boot-block" style="animation-delay: 0.18s"></div>
          </div>
          <div class="boot-row">
            <div class="boot-block" style="animation-delay: 0.09s"></div>
            <div class="boot-block" style="animation-delay: 0.00s"></div>
            <div class="boot-block" style="animation-delay: 0.00s"></div>
            <div class="boot-block" style="animation-delay: 0.09s"></div>
          </div>
          <div class="boot-row">
            <div class="boot-block" style="animation-delay: 0.09s"></div>
            <div class="boot-block" style="animation-delay: 0.00s"></div>
            <div class="boot-block" style="animation-delay: 0.00s"></div>
            <div class="boot-block" style="animation-delay: 0.09s"></div>
          </div>
          <div class="boot-row">
            <div class="boot-block" style="animation-delay: 0.18s"></div>
            <div class="boot-block" style="animation-delay: 0.18s"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
